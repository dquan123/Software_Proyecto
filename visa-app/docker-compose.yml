version: '3.8'

services:

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visa_db
    ports:
      - "5433:5432"
    volumes:
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql