version: '3.8'

services:

  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build:
       context: ./frontend
       args:
         - VITE_API_URL=http://3.14.12.212:3000

    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql
